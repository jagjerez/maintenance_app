name: Deploy to Vercel Preview (CLI)

on:
  push:
    branches: [ 'feature/**' ]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint
      
    - name: Install Vercel CLI
      run: npm install --global vercel@latest
      
    - name: Pull Vercel Environment Information
      run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      
    - name: Build Project Artifacts
      run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      
    - name: List and Clean Previous Preview Deployments
      run: |
        echo "Listing current preview deployments..."
        vercel ls --token=${{ secrets.VERCEL_TOKEN }}
        
        echo "Cleaning up old preview deployments (keeping last 5)..."
        vercel ls --token=${{ secrets.VERCEL_TOKEN }} --json | jq -r '.[5:] | .[].uid' | while read deployment_id; do
          if [ ! -z "$deployment_id" ]; then
            echo "Removing preview deployment: $deployment_id"
            vercel rm $deployment_id --yes --token=${{ secrets.VERCEL_TOKEN }} || echo "Failed to remove $deployment_id"
          fi
        done
        
    - name: Deploy Project Artifacts to Vercel Preview
      run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
