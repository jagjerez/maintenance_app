name: Deploy to Vercel Production (CLI)

on:
  push:
    branches: [ main ]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run lint
      
    - name: Build with Next.js
      run: npm run build
      
    - name: Install Vercel CLI
      run: npm install --global vercel@latest
      
    - name: Pull Vercel Environment Information
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      
    - name: List and Clean Previous Deployments
      run: |
        echo "Listing current deployments..."
        vercel ls --prod --token=${{ secrets.VERCEL_TOKEN }}
        
        echo "Cleaning up old deployments (keeping last 3)..."
        vercel ls --prod --token=${{ secrets.VERCEL_TOKEN }} --json | jq -r '.[3:] | .[].uid' | while read deployment_id; do
          if [ ! -z "$deployment_id" ]; then
            echo "Removing deployment: $deployment_id"
            vercel rm $deployment_id --yes --token=${{ secrets.VERCEL_TOKEN }} || echo "Failed to remove $deployment_id"
          fi
        done
        
    - name: Deploy to Vercel Production
      run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
